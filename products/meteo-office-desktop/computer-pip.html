<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MeteoMate 桌面操作</title>
    <link rel="stylesheet" href="./styles-tokens.css" />
    <link rel="stylesheet" href="./computer-pip.css" />
  </head>
  <body>
    <main class="pip-shell">
      <header class="pip-header">
        <div class="pip-app">
          <img id="app-icon" alt="" />
          <strong id="window-label">正在连接窗口</strong>
        </div>
        <div class="pip-header-actions">
          <button type="button" id="return-button" title="返回 MeteoMate" aria-label="返回 MeteoMate">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18 3 12l6-6M3 12h12a6 6 0 0 1 6 6"/></svg>
          </button>
          <button type="button" id="close-button" title="关闭预览" aria-label="关闭预览">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>

      <section class="pip-preview">
        <video id="preview-video" autoplay muted playsinline></video>
        <img id="fallback-image" alt="最近一次桌面操作截图" />
        <div class="pip-placeholder" id="placeholder">
          <div class="pip-placeholder-mark">
            <span></span><span></span><span></span>
          </div>
          <strong id="placeholder-title">正在连接目标窗口</strong>
        </div>
        <div class="pip-state" id="state-badge" aria-live="polite">
          <i></i><span id="state-label">连接中</span>
        </div>
        <button type="button" class="pip-stop" id="stop-button" title="停止桌面操作" aria-label="停止桌面操作">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
        </button>
      </section>
    </main>
    <script src="./computer-pip.js"></script>
  </body>
</html>
