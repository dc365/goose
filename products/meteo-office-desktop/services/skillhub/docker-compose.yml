services:
  skillhub:
    build: .
    ports:
      - "8088:8088"
    environment:
      METEOMATE_SKILLHUB_BOOTSTRAP_USERNAME: ${METEOMATE_SKILLHUB_BOOTSTRAP_USERNAME:-admin}
      METEOMATE_SKILLHUB_BOOTSTRAP_PASSWORD: ${METEOMATE_SKILLHUB_BOOTSTRAP_PASSWORD:?set a one-time bootstrap password}
      METEOMATE_SKILLHUB_BOOTSTRAP_NAME: ${METEOMATE_SKILLHUB_BOOTSTRAP_NAME:-系统管理员}
    volumes:
      - skillhub-data:/var/lib/meteomate-skillhub/data

volumes:
  skillhub-data:
