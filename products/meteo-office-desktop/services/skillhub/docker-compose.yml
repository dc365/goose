services:
  skillhub:
    build: .
    ports:
      - "8088:8088"
    environment:
      METEOMATE_SKILLHUB_TOKENS: >-
        {"dev-admin":{"subject":"admin","name":"Local Admin","role":"admin","orgId":"meteomate"},"dev-publisher":{"subject":"publisher","name":"Local Publisher","role":"publisher","orgId":"meteomate"},"dev-user":{"subject":"user-1","name":"Local User","role":"viewer","orgId":"meteomate"}}
    volumes:
      - skillhub-data:/var/lib/meteomate-skillhub/data

volumes:
  skillhub-data:
