services:
  control-plane:
    build: .
    ports:
      - "8088:8088"
    environment:
      METEOMATE_BOOTSTRAP_ADMIN_USERNAME: ${METEOMATE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      METEOMATE_BOOTSTRAP_ADMIN_PASSWORD: ${METEOMATE_BOOTSTRAP_ADMIN_PASSWORD:?set METEOMATE_BOOTSTRAP_ADMIN_PASSWORD}
      METEOMATE_BOOTSTRAP_ADMIN_NAME: ${METEOMATE_BOOTSTRAP_ADMIN_NAME:-MeteoMate Administrator}
      METEOMATE_BOOTSTRAP_ADMIN_EMAIL: ${METEOMATE_BOOTSTRAP_ADMIN_EMAIL:-}
      METEOMATE_BOOTSTRAP_ORG_SLUG: ${METEOMATE_BOOTSTRAP_ORG_SLUG:-meteomate}
      METEOMATE_BOOTSTRAP_ORG_NAME: ${METEOMATE_BOOTSTRAP_ORG_NAME:-MeteoMate}
      METEOMATE_SKILLHUB_TOKENS: ${METEOMATE_SKILLHUB_TOKENS:-{}}
      METEOMATE_CONTROL_PLANE_PUBLIC_URL: ${METEOMATE_CONTROL_PLANE_PUBLIC_URL:-}
    volumes:
      - control-plane-data:/var/lib/meteomate-skillhub/data

volumes:
  control-plane-data:
