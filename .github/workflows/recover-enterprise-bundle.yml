name: Recover enterprise implementation bundle

on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-bundle-*.bin'
      - '.github/workflows/recover-enterprise-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recovery inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin \
            refs/heads/agent/recover-enterprise-runner:refs/remotes/origin/recovery \
            refs/heads/main:refs/remotes/origin/main
          git show origin/recovery:enterprise-bundle-1.bin > /tmp/enterprise-bundle-1.bin
          git show origin/recovery:enterprise-bundle-2.bin > /tmp/enterprise-bundle-2.bin

      - name: Reassemble and inspect bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip

          first = Path('/tmp/enterprise-bundle-1.bin').read_bytes()
          second = Path('/tmp/enterprise-bundle-2.bin').read_bytes()
          limit = min(len(first), len(second))
          overlap = 0
          for size in range(limit, 0, -1):
              if first[-size:] == second[:size]:
                  overlap = size
                  break
          candidates = {
              'first+second': first + second,
              'first+second_without_overlap': first + second[overlap:],
              'second+first': second + first,
          }
          print({'first': len(first), 'second': len(second), 'overlap': overlap, 'first_header': first[:8].hex(), 'second_header': second[:8].hex()})
          errors = {}
          for name, data in candidates.items():
              try:
                  expanded = gzip.decompress(data)
              except Exception as exc:
                  errors[name] = repr(exc)
                  continue
              target = Path('/tmp/enterprise-implementation.tar.gz')
              target.write_bytes(data)
              print({'selected': name, 'compressed': len(data), 'expanded': len(expanded), 'tar_header': expanded[:16].hex()})
              break
          else:
              print({'gzip_errors': errors})
              raise SystemExit('no candidate formed a valid gzip archive')
          PY
          tar -tzf /tmp/enterprise-implementation.tar.gz | tee /tmp/enterprise-files.txt
          test -s /tmp/enterprise-files.txt

      - name: Apply bundle to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -q -B agent/meteomate-enterprise-projects-v1 origin/main
          tar -xzf /tmp/enterprise-implementation.tar.gz -C .
          git status --short

      - name: Validate desktop and enterprise server
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=products/meteo-office-desktop
          SERVICE="$PRODUCT/services/skillhub"
          cd "$PRODUCT"
          npm ci --ignore-scripts
          npm run check
          cd - >/dev/null
          cd "$SERVICE"
          go test ./...
          go vet ./...
          cd - >/dev/null

      - name: Commit and push recovered feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MeteoMate Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No enterprise changes recovered' >&2
            exit 1
          fi
          git commit -m 'feat(meteomate): add enterprise connectors and projects'
          git push --force-with-lease origin HEAD:agent/meteomate-enterprise-projects-v1
