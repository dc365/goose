name: Export enterprise workspace

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/recover-enterprise-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout enterprise feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/meteomate-enterprise-projects-v1
          fetch-depth: 1
          show-progress: false

      - name: Archive MeteoMate product workspace
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/meteomate-enterprise-workspace.tar.gz \
            products/meteo-office-desktop \
            .github/workflows/meteomate-desktop.yml

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteomate-enterprise-workspace
          path: /tmp/meteomate-enterprise-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
