name: Recover enterprise implementation bundle

on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-bundle-*.bin'
      - '.github/workflows/recover-enterprise-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recovery inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin \
            refs/heads/agent/recover-enterprise-runner:refs/remotes/origin/recovery \
            refs/heads/main:refs/remotes/origin/main
          git show origin/recovery:enterprise-bundle-1.bin > /tmp/enterprise-bundle-1.bin
          git show origin/recovery:enterprise-bundle-2.bin > /tmp/enterprise-bundle-2.bin

      - name: Recover complete files from bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import io
          import os
          import shutil
          import tarfile
          import zlib

          first = Path('/tmp/enterprise-bundle-1.bin').read_bytes()
          second = Path('/tmp/enterprise-bundle-2.bin').read_bytes()
          limit = min(len(first), len(second))
          overlap = 0
          for size in range(limit, 0, -1):
              if first[-size:] == second[:size]:
                  overlap = size
                  break
          compressed = first + second[overlap:]
          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          expanded = inflater.decompress(compressed)
          try:
              expanded += inflater.flush()
          except zlib.error:
              pass
          print({'first': len(first), 'second': len(second), 'overlap': overlap, 'compressed': len(compressed), 'expanded': len(expanded), 'gzip_eof': inflater.eof})

          recovered = Path('/tmp/enterprise-recovered')
          shutil.rmtree(recovered, ignore_errors=True)
          recovered.mkdir(parents=True)
          names = []
          stream = io.BytesIO(expanded)
          try:
              archive = tarfile.open(fileobj=stream, mode='r:')
              while True:
                  try:
                      member = archive.next()
                  except (tarfile.ReadError, EOFError) as exc:
                      print({'tar_stopped': repr(exc), 'offset': stream.tell()})
                      break
                  if member is None:
                      break
                  name = PurePosixPath(member.name)
                  if name.is_absolute() or '..' in name.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member: {member.name}')
                  target = recovered.joinpath(*name.parts)
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  if not member.isfile():
                      continue
                  source = archive.extractfile(member)
                  if source is None:
                      continue
                  data = source.read()
                  if len(data) != member.size:
                      print({'truncated_member': member.name, 'expected': member.size, 'actual': len(data)})
                      break
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  os.chmod(target, member.mode & 0o777)
                  names.append(member.name)
          finally:
              try:
                  archive.close()
              except Exception:
                  pass
          print({'recovered_files': len(names), 'first_files': names[:10], 'last_files': names[-10:]})
          if not names:
              raise SystemExit('bundle did not contain any complete files')
          Path('/tmp/enterprise-files.txt').write_text('\n'.join(names) + '\n')
          PY
          cat /tmp/enterprise-files.txt

      - name: Apply recovered files to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -q -B agent/meteomate-enterprise-projects-v1 origin/main
          cp -a /tmp/enterprise-recovered/. .
          git status --short

      - name: Validate desktop and enterprise server
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=products/meteo-office-desktop
          SERVICE="$PRODUCT/services/skillhub"
          cd "$PRODUCT"
          npm ci --ignore-scripts
          npm run check
          cd - >/dev/null
          cd "$SERVICE"
          go test ./...
          go vet ./...
          cd - >/dev/null

      - name: Commit and push recovered feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MeteoMate Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No enterprise changes recovered' >&2
            exit 1
          fi
          git commit -m 'feat(meteomate): add enterprise connectors and projects'
          git push --force-with-lease origin HEAD:agent/meteomate-enterprise-projects-v1
