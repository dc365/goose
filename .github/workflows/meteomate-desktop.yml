name: MeteoMate Desktop

on:
  pull_request:
    paths:
      - 'products/meteo-office-desktop/**'
      - '.github/workflows/meteomate-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'products/meteo-office-desktop/**'
      - '.github/workflows/meteomate-desktop.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/meteo-office-desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: products/meteo-office-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check MeteoMate Desktop
        run: npm run check

      - name: Use Go from SkillHub module
        uses: actions/setup-go@v5
        with:
          go-version-file: products/meteo-office-desktop/services/skillhub/go.mod
          cache: false

      - name: Test SkillHub Server
        working-directory: products/meteo-office-desktop/services/skillhub
        run: go test ./...

      - name: Vet SkillHub Server
        working-directory: products/meteo-office-desktop/services/skillhub
        run: go vet ./...
