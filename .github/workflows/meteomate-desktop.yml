name: MeteoMate Desktop

on:
  pull_request:
    paths:
      - 'products/meteo-office-desktop/**'
      - '.github/workflows/meteomate-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'products/meteo-office-desktop/**'
      - '.github/workflows/meteomate-desktop.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/meteo-office-desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: products/meteo-office-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run desktop smoke test
        run: npm run test:smoke

      - name: Run Harness unit tests
        run: npm run test:harness-core

      - name: Run state bootstrap test
        run: npm run test:state-bootstrap

      - name: Run Capability Center tests
        run: npm run test:capabilities

      - name: Validate product schemas
        run: npm run check:schemas
